name: 매일 공고 수집

on:
  schedule:
    - cron: '0 22 * * *'   # 매일 07:00 (한국시간)
  workflow_dispatch:        # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 공고 수집
        run: python collector/collect.py
      - name: 디스코드 알림
        if: env.DISCORD_WEBHOOK != ''
        env:
          SITE_URL: https://041211lhs.github.io/job-board/
        run: python collector/notify.py
      - name: 결과 저장
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "공고 갱신 $(TZ=Asia/Seoul date +%F)"
          git push
